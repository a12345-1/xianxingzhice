<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>闲行智策 · 一句话排好一趟旅行</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="title">闲行智策</div>
    <div class="spacer"></div>
    <a class="back" href="/saved.html">我的</a>
  </header>

  <div class="p1-grid">
    <aside class="p1-left">
      <h2>一句话，排好一趟旅行</h2>
      <p>说清想去哪、几天、花多少，剩下的交给它。</p>
      <div class="examples" id="examples">
        <button data-fill="周末两天，别太赶，想找个安静的古镇">周末两天，带娃，别太累</button>
        <button data-fill="五天四晚，成都，吃货路线，预算 2000">五天四晚，成都，吃货路线</button>
        <button data-fill="十一去杭州，情侣，预算 5000，不想太挤">十一，情侣，预算 5000</button>
      </div>
    </aside>

    <section class="form-col">
      <h2 style="margin:0 0 10px;font-size:17px">想去哪儿，玩几天？</h2>
      <textarea id="text" placeholder="周末两天放松一下，别太赶"></textarea>
      <div class="echo" id="echo"></div>

      <div class="row">
        <span class="label">玩几天</span>
        <div class="stepper">
          <button id="minus" aria-label="减少">－</button>
          <span class="val" id="days">3</span>
          <button id="plus" aria-label="增加">＋</button>
        </div>
      </div>

      <div class="row">
        <span class="label">预算上限</span>
        <div class="budget-row">
          <span class="yen">¥</span>
          <input id="budget" type="number" min="0" step="100" placeholder="不限" />
          <button class="chip" id="no-limit">不限</button>
        </div>
      </div>

      <button class="btn block" id="gen" style="margin-top:8px">生成我的行程</button>
      <div class="err" id="err"></div>
      <div id="ask"></div>

      <div id="recent" style="margin-top:18px"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
