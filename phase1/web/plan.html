<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>行程 · 闲行智策</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="back" href="/" id="back">‹ 返回</a>
    <div class="title" id="title">行程</div>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <span class="badge" id="dirty" style="display:none">编辑中</span>
    <button class="btn sm" id="save">保存</button>
  </header>

  <div class="summary-bar" id="summary"></div>
  <div id="plan-note"></div>

  <div class="plan-layout">
    <aside class="day-list" id="dayList"></aside>

    <main>
      <div class="day-tabs" id="dayTabs"></div>
      <div class="day-head" id="dayHead"></div>
      <div id="items"></div>
    </main>

    <aside class="side" id="side"></aside>
  </div>
</div>

<div class="bar-bottom" id="bottom"></div>

<div class="undo" id="undo"><span id="undo-text">已删除</span><button id="undo-btn">撤销</button></div>

<div class="drawer" id="drawer">
  <div class="drawer-card">
    <button class="drawer-close" id="drawer-close">×</button>
    <div id="drawer-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/render.js"></script>
<script src="/js/plan.js"></script>
</body>
</html>
