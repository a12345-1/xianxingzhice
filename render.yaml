# Render 一键部署配置
# 线上跑的是 phase1（单人版）；根目录那套是早期版本，仅作参考
services:
  - type: web
    name: xianxing-zhice
    runtime: python
    plan: free
    region: singapore
    rootDir: phase1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # 有模型 Key 时再填，没有就保持 auto（走本地规则）
      - key: MOCK_MODE
        value: auto
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-chat
      # 高德 Key，用于「联网获取该城市地点」
      - key: AMAP_KEY
        sync: false
